name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you start a publish by hand from the Actions tab

permissions:
  contents: read
  pages: write    # upload the site
  id-token: write # prove to Pages that the upload comes from this workflow

# Only one publish at a time. A running publish is allowed to finish; a newer push
# replaces one that is still waiting to start.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2" # keep in sync with README "Building"

jobs:
  build:
    runs-on: ubuntu-24.04 # pinned, like the Godot version; update deliberately
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Download Godot
        run: |
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          rm godot.zip

      # The full template download is about 1.3 GB, but only the small web template is needed.
      # It is cached, so the large download only happens when the Godot version changes.
      - name: Cache the web export template
        id: templates
        uses: actions/cache@v6
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-web-template-${{ env.GODOT_VERSION }}

      - name: Download the web export template
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz templates/web_nothreads_release.zip
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          mv templates/* "$dest/"
          rm -r templates templates.tpz

      - name: Import the project
        run: ./godot --headless --path . --import

      - name: Export for the web
        run: |
          mkdir -p build
          ./godot --headless --path . --export-release "Web" build/index.html
          test -f build/index.wasm # the export command does not always fail when the export fails

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
